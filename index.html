<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庫洛姆5週年快樂</title>

  <style>
    :root {
      --gold: #ffd86b;
      --pink: #ff79b0;
      --purple: #8c67ff;
      --white: #ffffff;
      --dark: #120f25;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--white);
      overflow-x: hidden;

      background:
        linear-gradient(rgba(10, 7, 30, 0.48), rgba(10, 7, 30, 0.76)),
        url("e4b97907-fc67-4418-966b-8795982239df.png") center center / cover fixed no-repeat;


      background-color: #201548;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 121, 176, .22), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(140, 103, 255, .25), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(255, 216, 107, .14), transparent 30%);
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px #fff;
      opacity: .6;
      animation: twinkle 2.8s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(.7); opacity: .25; }
      50% { transform: scale(1.6); opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .card {
      width: min(940px, 100%);
      text-align: center;
      padding: 64px 30px 54px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 32px;
      background: rgba(19, 13, 48, .58);
      box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.13);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 800;
      letter-spacing: .08em;
      color: #2a1b00;
      background: linear-gradient(135deg, #fff0a0, var(--gold));
      box-shadow: 0 7px 25px rgba(255, 216, 107, .22);
    }

    h1 {
      margin: 24px 0 10px;
      font-size: clamp(3.4rem, 10vw, 7.5rem);
      line-height: .95;
      letter-spacing: -.04em;
      text-shadow: 0 8px 35px rgba(0,0,0,.35);
    }

    h1 .name {
      display: block;
      background: linear-gradient(90deg, #fff, #ffd9ec, #e5ddff, #fff1ad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 .year {
      display: block;
      margin-top: 14px;
      font-size: .37em;
      letter-spacing: .17em;
      color: var(--gold);
    }

    .subtitle {
      margin: 24px auto 0;
      max-width: 680px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.9;
      color: rgba(255,255,255,.86);
    }

    .five {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 118px;
      height: 118px;
      margin-top: 34px;
      border-radius: 50%;
      font-size: 4.2rem;
      font-weight: 900;
      color: #281800;
      background: linear-gradient(145deg, #fff8c8, #ffd15f);
      box-shadow:
        0 0 0 10px rgba(255,216,107,.10),
        0 0 55px rgba(255,216,107,.34);
      animation: float 3s ease-in-out infinite;
    }

    .five::after {
      content: "YEARS";
      position: absolute;
      bottom: 12px;
      font-size: .62rem;
      letter-spacing: .24em;
      font-weight: 900;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 230px;
      padding: 16px 26px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.05rem;
      color: #251600;
      background: linear-gradient(135deg, #fff0a3, #ffc948);
      box-shadow: 0 10px 28px rgba(255, 200, 72, .25);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 34px rgba(255, 200, 72, .34);
      filter: brightness(1.05);
    }

    .download-btn:active {
      transform: translateY(0) scale(.98);
    }

    .note {
      margin-top: 18px;
      font-size: .86rem;
      color: rgba(255,255,255,.56);
    }

    .footer {
      margin-top: 48px;
      font-size: .85rem;
      letter-spacing: .08em;
      color: rgba(255,255,255,.45);
    }

    @media (max-width: 600px) {
      .card {
        padding: 46px 20px 40px;
        border-radius: 24px;
      }

      .five {
        width: 100px;
        height: 100px;
        font-size: 3.6rem;
      }

      .download-btn {
        width: 100%;
      }
    }
  

    button.download-btn { border:0; cursor:pointer; font-family:inherit; }
    .download-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,4,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .download-modal.is-open{display:flex}
    .download-modal-panel{position:relative;width:min(680px,100%);padding:34px 28px 30px;text-align:center;border:1px solid rgba(255,255,255,.2);border-radius:26px;background:rgba(27,18,61,.96);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:modalIn .25s ease-out}
    @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-close{position:absolute;top:12px;right:14px;width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:1.4rem;background:rgba(255,255,255,.09)}
    .modal-title{margin:4px 0 10px;font-size:1.6rem;font-weight:900;color:#fff}.modal-text{margin:0;line-height:1.8;color:rgba(255,255,255,.72)}
    .countdown-circle{display:grid;place-items:center;width:112px;height:112px;margin:26px auto 20px;border-radius:50%;border:3px solid rgba(255,216,107,.85);box-shadow:0 0 28px rgba(255,216,107,.18);font-size:2.6rem;font-weight:900;color:var(--gold)}
    .real-download-btn{display:none;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:22px;padding:15px 22px;border-radius:15px;text-decoration:none;font-weight:900;font-size:1.05rem;color:#251600;background:linear-gradient(135deg,#fff0a3,#ffc948);box-shadow:0 10px 28px rgba(255,200,72,.25)}
    .real-download-btn.show{display:inline-flex}.waiting-hint{margin-top:8px;font-size:.88rem;color:rgba(255,255,255,.52)}


    /* ★ YouTube 影片嵌入區 ★ */
    .youtube-wrap{width:100%;aspect-ratio:16/9;margin:20px 0 18px;border-radius:18px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
    .youtube-wrap iframe{display:block;width:100%;height:100%;border:0}
    .youtube-placeholder{width:100%;height:100%;display:grid;place-items:center;padding:20px;text-align:center;line-height:1.7;color:rgba(255,255,255,.48);background:radial-gradient(circle at center,rgba(255,216,107,.08),transparent 55%)}
</style>
</head>

<body>

  <!-- 裝飾星光 -->
  <div class="stars" aria-hidden="true">
    <span class="star" style="left:8%;top:18%;animation-delay:.2s"></span>
    <span class="star" style="left:18%;top:72%;animation-delay:1.4s"></span>
    <span class="star" style="left:33%;top:12%;animation-delay:2s"></span>
    <span class="star" style="left:47%;top:84%;animation-delay:.6s"></span>
    <span class="star" style="left:61%;top:16%;animation-delay:1.1s"></span>
    <span class="star" style="left:73%;top:70%;animation-delay:2.3s"></span>
    <span class="star" style="left:87%;top:23%;animation-delay:.9s"></span>
    <span class="star" style="left:93%;top:83%;animation-delay:1.8s"></span>
  </div>

  <main class="page">
    <section class="card">
      <div class="badge">★ 5th ANNIVERSARY ★</div>

      <h1>
        <span class="name">庫洛姆</span>
        <span class="year">五週年快樂</span>
      </h1>

      <p class="subtitle">
        不知不覺庫庫就五週年了<br>
        這次委託DaMo噠毛老師繪製了可愛的貼圖<br>
        希望庫庫喜歡。<br>
      </p>

      <div class="five">5</div>

      <div class="actions">

        <button
          class="download-btn"
          id="openDownloadModal"
          type="button"
        >
          ↓下載5週年的小禮物
        </button>
      </div>

      <p class="note">
        點擊上方按鈕即可增加10公分腰圍
      </p>

      <div class="footer">
        KUROMU · 5TH ANNIVERSARY
      </div>
    </section>
  </main>


<div class="download-modal" id="downloadModal" role="dialog" aria-modal="true" aria-labelledby="downloadModalTitle">
  <div class="download-modal-panel">
    <button class="modal-close" id="closeDownloadModal" type="button" aria-label="關閉">×</button>
    <div class="modal-title" id="downloadModalTitle">下載即將準備完成</div>
    <p class="modal-text">感謝你參與庫洛姆 5 週年紀念。<br>請稍候，下載連結將在倒數結束後開放。</p>


    <div class="youtube-wrap">
         <iframe src="https://www.youtube.com/embed/b9a07TvRlgg"
                 title="庫洛姆五週年紀念影片"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen></iframe>
    </div>

    <div class="countdown-circle" id="downloadCountdown" aria-live="polite">10</div>
    <div class="waiting-hint" id="waitingHint">還需要等待 10 秒</div>
    <!-- ★ 真正下載檔案替換位置：修改下面 href 即可 ★ -->
    <a class="real-download-btn" id="realDownloadButton" href="https://drive.google.com/file/d/1bhCPQNF0oqaElpZn-9YlBEP89OyXCsWm/view?usp=sharing" download>↓ 立即下載貼圖</a>
  </div>
</div>
<script>
(()=>{
 const openButton=document.getElementById('openDownloadModal');
 const modal=document.getElementById('downloadModal');
 const closeButton=document.getElementById('closeDownloadModal');
 const countdown=document.getElementById('downloadCountdown');
 const waitingHint=document.getElementById('waitingHint');
 const realDownloadButton=document.getElementById('realDownloadButton');
 let timer=null,secondsLeft=10;
 function resetModal(){if(timer){clearInterval(timer);timer=null;}secondsLeft=10;countdown.textContent='10';waitingHint.textContent='還需要等待 10 秒';realDownloadButton.classList.remove('show');}
 function openModal(){resetModal();modal.classList.add('is-open');closeButton.focus();timer=setInterval(()=>{secondsLeft--;countdown.textContent=secondsLeft;waitingHint.textContent=`還需要等待 ${secondsLeft} 秒`;if(secondsLeft<=0){clearInterval(timer);timer=null;countdown.textContent='✓';waitingHint.textContent='下載已準備完成';realDownloadButton.classList.add('show');realDownloadButton.focus();}},1000);}
 function closeModal(){modal.classList.remove('is-open');if(timer){clearInterval(timer);timer=null;}openButton.focus();}
 openButton.addEventListener('click',openModal);closeButton.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('is-open'))closeModal();});
})();
</script>

</body>
</html>
