<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庫洛姆 5 週年紀念禮物</title>

  <style>
    :root {
      --gold: #ffd86b;
      --pink: #ff79b0;
      --purple: #8c67ff;
      --white: #ffffff;
      --dark: #120f25;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--white);
      overflow-x: hidden;
      background:
        linear-gradient(rgba(10, 7, 30, 0.48), rgba(10, 7, 30, 0.76)),
        url("e4b97907-fc67-4418-966b-8795982239df.png") center center / cover fixed no-repeat;


      background-color: #201548;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 121, 176, .22), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(140, 103, 255, .25), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(255, 216, 107, .14), transparent 30%);
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px #fff;
      opacity: .6;
      animation: twinkle 2.8s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(.7); opacity: .25; }
      50% { transform: scale(1.6); opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .card {
      width: min(940px, 100%);
      text-align: center;
      padding: 64px 30px 54px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 32px;
      background: rgba(19, 13, 48, .58);
      box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.13);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 800;
      letter-spacing: .08em;
      color: #2a1b00;
      background: linear-gradient(135deg, #fff0a0, var(--gold));
      box-shadow: 0 7px 25px rgba(255, 216, 107, .22);
    }

    h1 {
      margin: 24px 0 10px;
      font-size: clamp(3.4rem, 10vw, 7.5rem);
      line-height: .95;
      letter-spacing: -.04em;
      text-shadow: 0 8px 35px rgba(0,0,0,.35);
    }

    h1 .name {
      display: block;
      background: linear-gradient(90deg, #fff, #ffd9ec, #e5ddff, #fff1ad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 .year {
      display: block;
      margin-top: 14px;
      font-size: .37em;
      letter-spacing: .17em;
      color: var(--gold);
    }

    .subtitle {
      margin: 24px auto 0;
      max-width: 680px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.9;
      color: rgba(255,255,255,.86);
    }

    .five {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 118px;
      height: 118px;
      margin-top: 34px;
      border-radius: 50%;
      font-size: 4.2rem;
      font-weight: 900;
      color: #281800;
      background: linear-gradient(145deg, #fff8c8, #ffd15f);
      box-shadow:
        0 0 0 10px rgba(255,216,107,.10),
        0 0 55px rgba(255,216,107,.34);
      animation: float 3s ease-in-out infinite;
    }

    .five::after {
      content: "YEARS";
      position: absolute;
      bottom: 12px;
      font-size: .62rem;
      letter-spacing: .24em;
      font-weight: 900;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 230px;
      padding: 16px 26px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.05rem;
      color: #251600;
      background: linear-gradient(135deg, #fff0a3, #ffc948);
      box-shadow: 0 10px 28px rgba(255, 200, 72, .25);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 34px rgba(255, 200, 72, .34);
      filter: brightness(1.05);
    }

    .download-btn:active {
      transform: translateY(0) scale(.98);
    }

    .note {
      margin-top: 18px;
      font-size: .86rem;
      color: rgba(255,255,255,.56);
    }

    .footer {
      margin-top: 48px;
      font-size: .85rem;
      letter-spacing: .08em;
      color: rgba(255,255,255,.45);
    }

    @media (max-width: 600px) {
      .card {
        padding: 46px 20px 40px;
        border-radius: 24px;
      }

      .five {
        width: 100px;
        height: 100px;
        font-size: 3.6rem;
      }

      .download-btn {
        width: 100%;
      }
    }
  </style>

      <div class="five">5</div>

      <div class="actions">

      </div>

      <p class="note">

      <div class="footer">

</body>
